name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 43.138.207.105 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key root@43.138.207.105 << 'ENDSSH'
            set -e

            echo "开始部署..."

            # 创建项目目录
            mkdir -p ~/water-delivery
            cd ~/water-delivery

            # 更新代码
            echo "拉取最新代码..."
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main
            else
              git clone https://github.com/d421939142/tongzhuangshuipeisongruanjian.git .
            fi

            # 检查并安装依赖
            echo "检查环境..."

            if ! command -v docker &> /dev/null; then
              echo "Docker未安装，正在安装..."
              curl -fsSL https://get.docker.com | sh
              usermod -aG docker $USER
            fi

            if ! command -v docker-compose &> /dev/null; then
              echo "Docker Compose未安装，正在安装..."
              curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)" -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
            fi

            if ! command -v node &> /dev/null; then
              echo "Node.js未安装，正在安装..."
              curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
              apt install -y nodejs
            fi

            # 创建环境变量
            echo "配置环境变量..."
            mkdir -p prod
            if [ ! -f "prod/.env" ]; then
              cat > prod/.env << 'ENVEOF'
NODE_ENV=production
BACKEND_PORT=3001
API_KEY=water-delivery-$(openssl rand -hex 16)
DB_PATH=/app/data/database.db
LOG_LEVEL=info
LOG_PATH=/app/logs
VITE_API_URL=http://43.138.207.105/api
VITE_APP_TITLE=桶装水配送管理系统
VITE_DELIVERY_API_URL=http://43.138.207.105/api
VITE_DELIVERY_APP_TITLE=配送助手
NGINX_PORT=80
DOMAIN=43.138.207.105
DELIVERY_DOMAIN=43.138.207.105
ENVEOF
            fi

            # 构建前端
            echo "构建前端..."
            cd frontend
            npm install --legacy-peer-deps
            npm run build

            cd ../delivery-app
            npm install --legacy-peer-deps
            npm run build

            cd ~/water-delivery

            # 启动Docker服务
            echo "启动Docker服务..."
            docker-compose -f docker-compose.prod.yml down 2>/dev/null || true
            docker-compose -f docker-compose.prod.yml build
            docker-compose -f docker-compose.prod.yml up -d

            # 等待服务启动
            echo "等待服务启动..."
            sleep 10

            # 检查服务状态
            echo "检查服务状态..."
            docker-compose -f docker-compose.prod.yml ps

            echo "部署完成！"
          ENDSSH

      - name: Notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 部署成功！"
            echo "访问地址: http://43.138.207.105"
          else
            echo "❌ 部署失败，请检查日志"
            exit 1
          fi
